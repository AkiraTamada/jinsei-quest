<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>人生クエスト</title>
<meta name="theme-color" content="#17435F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="人生クエスト">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<script src="vendor/jszip.min.js"></script>
<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one-column phone app (max 560px). Bottom 4-tab bar, edits in bottom sheets.
   Roadmap = vertical trail of phase regions; goals are nodes on a dotted path, final flag at the end. */
:root{
  --bg:#E8EEF2; --surface:#FFFFFF; --surface-2:#F2F6F8; --ink:#12212C; --ink-2:#4F626F; --line:#D2DDE4;
  --brand:#17435F; --on-brand:#FFFFFF; --link:#17435F; --dot:#17435F;
  --gold:#F2A900; --on-gold:#2A1D00; --gold-soft:#FFF0C9;
  --good:#1B9567; --bad:#B93A2B; --track:#DAE4EA; --scrim:rgba(8,18,26,.55);
  --ph-l:38%; --ph-s:55%;
  --skin:#F1C7A3; --hair:#3A2E2A; --shirt:#2F7FB8; --pants:#3C4F63; --bag:#8A5A3C;
  --f-display:"Dela Gothic One","Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1820; --surface:#15232D; --surface-2:#1B2C38; --ink:#E6EEF3; --ink-2:#9DAEBB; --line:#2A3D4A;
    --brand:#245F85; --on-brand:#FFFFFF; --link:#86C0E6; --dot:#86C0E6;
    --gold:#F5B93A; --on-gold:#2A1D00; --gold-soft:#3A2F12;
    --good:#4CC590; --bad:#FF9082; --track:#263846; --scrim:rgba(0,0,0,.62);
    --ph-l:64%; --ph-s:60%; color-scheme:dark;
    --skin:#E8B98F; --hair:#2A2020; --shirt:#4A9AD0; --pants:#6E86A0; --bag:#C18D66;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1820; --surface:#15232D; --surface-2:#1B2C38; --ink:#E6EEF3; --ink-2:#9DAEBB; --line:#2A3D4A;
  --brand:#245F85; --on-brand:#FFFFFF; --link:#86C0E6; --dot:#86C0E6;
  --gold:#F5B93A; --on-gold:#2A1D00; --gold-soft:#3A2F12;
  --good:#4CC590; --bad:#FF9082; --track:#263846; --scrim:rgba(0,0,0,.62);
  --ph-l:64%; --ph-s:60%; color-scheme:dark;
  --skin:#E8B98F; --hair:#2A2020; --shirt:#4A9AD0; --pants:#6E86A0; --bag:#C18D66;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 var(--f-body);
  padding-block:0 92px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.lock{overflow:hidden}
#app{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px;background:var(--bg)}
.logo{font:400 19px/1 var(--f-display);letter-spacing:.02em}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);padding:0;flex:none}
.icon-btn.sm{width:38px;height:38px}
main{display:flex;flex-direction:column;gap:14px;outline:none}
h1.page{font:400 24px/1.3 var(--f-display);margin:6px 0 0;text-wrap:balance}
h2{font:700 14px/1.4 var(--f-body);margin:0;color:var(--ink-2);letter-spacing:.04em}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{border:0;border-radius:12px;padding:11px 16px;min-height:44px;font-weight:700;background:var(--brand);color:var(--on-brand);text-align:center}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.small{min-height:38px;padding:7px 14px;font-size:14px}
.btn:disabled{opacity:.5}

.hero{background:var(--brand);color:var(--on-brand);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero-name{font-size:13px;opacity:.85;overflow-wrap:anywhere}
.hero-title{font:400 20px/1.3 var(--f-display)}
.lv{display:flex;align-items:baseline;gap:4px;font-family:var(--f-display)}
.lv span{font-size:16px;opacity:.85}
.lv b{font-size:52px;line-height:1;font-weight:400;color:var(--gold)}
.xp{height:14px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.xp i{display:block;height:100%;border-radius:99px;background:var(--gold);transition:width .6s ease}
.xp-cap{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.14);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

.stage{background:var(--surface-2);color:var(--ink);border-radius:16px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.avatar{width:100%;max-width:240px;height:auto;display:block}
.av{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 16px;font-size:14px;font-weight:700;color:var(--ink);text-align:center;min-height:40px}
button.bubble{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.abil{--c:hsl(var(--h) var(--ph-s) var(--ph-l));display:grid;grid-template-columns:60px 38px minmax(0,1fr) 52px;align-items:center;gap:8px;font-size:13px}
.an{font-weight:700}
.al{font:400 13px var(--f-display);color:var(--c)}
.at{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.at i{display:block;height:100%;border-radius:99px;background:var(--c);transition:width .6s ease}
.ap{font-size:12px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.quest{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.check{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);display:grid;place-items:center;flex:none;color:transparent;padding:0}
.check svg{width:20px;height:20px;stroke-width:3}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
.xp-tag{font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap}

.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2);min-width:0}
.badge b{display:block;font-size:14px;line-height:1.4}
.badge span{font-size:12px;color:var(--ink-2)}
.badge.on{background:var(--gold-soft);border-color:var(--gold)}
.badge.on span{color:var(--ink)}
.badge:not(.on){opacity:.65}

.welcome h1{font:400 26px/1.35 var(--f-display);text-wrap:balance;margin:0}
.how{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.how li{display:flex;gap:10px;align-items:flex-start}
.how svg{flex:none;margin-top:2px;color:var(--link)}
.mini{width:100%;height:auto}
.mini .tr{fill:none;stroke:var(--link);stroke-width:3;stroke-linecap:round;stroke-dasharray:.1 9;opacity:.6}
.mini .nd{fill:var(--surface);stroke:var(--link);stroke-width:4}
.mini .nd.f{fill:var(--link)}
.mini .fl{fill:var(--gold)}

.region{--ph:hsl(var(--h) var(--ph-s) var(--ph-l));gap:10px}
.rhead{display:flex;align-items:center;gap:10px}
.rname{font:400 20px/1.3 var(--f-display);color:var(--ph);display:flex;align-items:center;gap:8px;flex-wrap:wrap;overflow-wrap:anywhere}
.here{font:700 11px/1 var(--f-body);background:var(--gold);color:var(--on-gold);padding:4px 8px;border-radius:99px;letter-spacing:.04em}
.ryears{font-size:13px;color:var(--ink-2)}
.trail{position:relative;width:100%}
.trail svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.trail path{fill:none;stroke:var(--ph);stroke-opacity:.6;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:.1 10;vector-effect:non-scaling-stroke}
.node{position:absolute;width:56px;height:56px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;
  background:conic-gradient(var(--ph) calc(var(--p)*1%),var(--track) 0);color:var(--ink);z-index:1}
.node::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface)}
.node>*{position:relative;z-index:1}
.node .np{font:400 14px/1 var(--f-display);font-variant-numeric:tabular-nums}
.node.done{color:#fff}
.node.done::after{background:var(--ph)}
.node svg{width:26px;height:26px;stroke-width:3}
.lbl{position:absolute;height:68px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;background:none;border:0;padding:0;min-width:0;z-index:1}
.lbl.r{text-align:right;align-items:flex-end}
.lbl b{font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.lbl small{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
input[type=date]{min-height:46px;display:block;width:100%;max-width:100%;min-width:0;-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.4em}
.flagcard{display:flex;align-items:center;gap:12px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:14px;padding:14px 16px;color:var(--ink)}
.flagcard svg{width:28px;height:28px;flex:none}
.flagcard p{overflow-wrap:anywhere}

.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head b{font:400 17px/1.3 var(--f-display)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .wd{font-size:11px;font-weight:700;color:var(--ink-2)}
.day{aspect-ratio:1;max-width:100%;border:0;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;color:var(--ink);padding:0;min-width:0;font-variant-numeric:tabular-nums}
.day::after{content:"";width:6px;height:6px;border-radius:50%;background:transparent}
.day.has::after{background:var(--dot);opacity:calc(.4 + var(--m,3)*.12)}
.day.today{box-shadow:inset 0 0 0 2px var(--gold)}
.day.sel{background:var(--brand);color:var(--on-brand)}
.day.sel.has::after{background:var(--on-brand);opacity:1}
.day:disabled{opacity:.35;cursor:default}
.ed-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ed-head h2{font:400 18px/1.4 var(--f-display);color:var(--ink)}
.save{font-size:12px;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lab{font-size:12px;font-weight:700;color:var(--ink-2)}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:120px;resize:vertical;line-height:1.7}
textarea.short{min-height:74px}
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mood{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink-2);min-width:0}
.mood svg{width:30px;height:30px}
.mood[aria-pressed=true]{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.cleared{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px}
.cleared li{margin-left:1.1em}
.entry{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 0}
.entry .ed{min-width:64px;font-weight:700;font-size:13px;line-height:1.5;flex:none}
.entry .ep{flex:1;min-width:0;display:flex;gap:8px;align-items:flex-start}
.entry .ep p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}
.mf{width:22px;height:22px;flex:none;color:var(--ink-2)}
.mf svg{width:100%;height:100%}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;min-height:38px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--on-brand)}
.cmp{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.cmp-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cmp-top b{font-size:14px}
.delta{font-size:13px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)}
.bar{display:grid;grid-template-columns:44px 1fr 64px;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar .t{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:99px;background:var(--ink-2);opacity:.55}
.bar.now .t i{background:var(--brand);opacity:1}
.bar.now{color:var(--ink);font-weight:700}
.bar .v{text-align:right}
.sum{font-size:14px;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.chart{width:100%;height:auto;display:block}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .past{fill:var(--surface-2)}
.chart .div{stroke:var(--ink-2);stroke-dasharray:3 4;stroke-width:1}
.chart .dot{fill:var(--dot);opacity:.45}
.chart .avg{fill:none;stroke:var(--dot);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart text{fill:var(--ink-2);font:700 10px var(--f-body)}
.pastcard blockquote{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.log li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.log{margin:0;padding:0;list-style:none}
.log span{color:var(--ink-2);white-space:nowrap;font-size:12px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px;gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:0;background:none;color:var(--ink-2);font-size:11px;font-weight:700;border-radius:12px;min-height:52px}
.tab svg{width:24px;height:24px}
.tab[aria-current=page]{color:var(--link);background:var(--surface-2)}

.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:var(--scrim)}
.sheet-body{position:relative;width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;outline:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh-title{font:400 19px/1.3 var(--f-display);color:var(--ink);margin:0}
.srow{display:flex;align-items:center;gap:8px}
.srow .btn{white-space:nowrap;flex:none}
.srow input{flex:1}
.hr{height:1px;background:var(--line);border:0;margin:0}
.note{font-size:13px;color:var(--ink-2)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:min(92vw,420px);
  transition:opacity .25s,transform .25s;z-index:60;text-align:center;white-space:pre-line}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.gold{background:var(--gold);color:var(--on-gold);font:400 17px/1.5 var(--f-display);padding:14px 22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo">人生クエスト</div>
    <button class="icon-btn" data-a="settings" aria-label="設定とデータの書き出し"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </header>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="tabs" aria-label="メイン"><div class="tabs-in" id="tabs"></div></nav>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const TODAY=()=>ymd(new Date());
const WD=['日','月','火','水','木','金','土'];
const fmtMD=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'};
const fmtFull=s=>{const d=parse(s);return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+WD[d.getDay()]+')'};
const uid8=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
const weekKey=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const has=s=>!!(s&&String(s).trim());

const ICON={

  map:'<path d="M9 4 3 6.5v13L9 17l6 3 6-2.5v-13L15 7zM9 4v13M15 7v13"/>',

function skillPts(){
  const p={body:0,mind:0,heart:0,bond:0,work:0};
  Object.values(S.entries).forEach(e=>{p.heart+=10;if(has(e.fun))p.heart+=5});
  goals().forEach(g=>{const k=goalSkill(g);g.steps.forEach(s=>{if(s.done)p[k]+=20});if(goalDone(g))p[k]+=100});
  Object.values(S.reviews).forEach(r=>{if(has(r.good)||has(r.next)||has(r.message))p.mind+=15});
  return p;
}
function xpTotal(){const p=skillPts();return p.body+p.mind+p.heart+p.bond+p.work}
const SLV=p=>Math.floor(1+Math.sqrt(p/20));
function snap(){const p=skillPts(),o={};AB.forEach(a=>{o[a.k]=SLV(p[a.k])});return {xp:xpTotal(),sk:o}}
const LV=xp=>Math.floor((1+Math.sqrt(1+4*xp/25))/2);
const needFor=l=>25*l*(l-1);
const TITLES=[[1,'はじまりの旅人'],[3,'駆け出しの冒険者'],[5,'道をひらく者'],[8,'ベテラン冒険者'],[12,'地図をつくる人'],[16,'伝説の旅人'],[20,'人生の達人']];
const titleOf=l=>{let t=TITLES[0][1];TITLES.forEach(x=>{if(l>=x[0])t=x[1]});return t};
function streakInfo(){
  const dates=Object.keys(S.entries).sort(),set=new Set(dates),t=TODAY();
  let cur=0,d=set.has(t)?t:addDays(t,-1);
  while(set.has(d)){cur++;d=addDays(d,-1)}
  let best=0,run=0,prev=null;
  dates.forEach(x=>{run=(prev&&diffDays(x,prev)===1)?run+1:1;if(run>best)best=run;prev=x});
  return {cur:cur,best:best};
}
function achievements(){
  const n=Object.keys(S.entries).length,st=streakInfo(),cleared=allSteps().filter(x=>x.s.done).length;
  const gd=goals().filter(goalDone).length,fn=Object.values(S.entries).filter(e=>has(e.fun)).length,rv=Object.keys(S.reviews).length;

function rangeStats(a,b){
  let days=0,ms=0,mn=0,fun=0,steps=0;
  Object.keys(S.entries).forEach(d=>{if(d>=a&&d<=b){const e=S.entries[d];days++;if(e.mood){ms+=e.mood;mn++}if(has(e.fun))fun++}});
  allSteps().forEach(x=>{if(x.s.done&&x.s.at&&x.s.at>=a&&x.s.at<=b)steps++});
  return {days:days,mood:mn?ms/mn:null,fun:fun,steps:steps,xp:days*10+fun*5+steps*20};
}

const DR={diary:{},reviews:{}},CH={},TM={};
const FIELDS={diary:['text','fun'],reviews:['good','next','message']};
const emptyOf=k=>k==='diary'?{text:'',fun:'',mood:0}:{good:'',next:'',message:''};
const mapOf=k=>k==='diary'?S.entries:S.reviews;
function entryOf(date){return DR.diary[date]||S.entries[date]||emptyOf('diary')}
function reviewOf(key){return DR.reviews[key]||S.reviews[key]||emptyOf('reviews')}
function setSave(s){S.save=s;const el=$('#saveState');if(el)el.textContent=({pending:'入力中…',saving:'保存中…',saved:'保存しました',error:'保存できませんでした'})[s]||''}
function setDraft(kind,key,field,val){
  const base=DR[kind][key]||Object.assign({},mapOf(kind)[key]||emptyOf(kind));
  base[field]=val;base._v=(base._v||0)+1;DR[kind][key]=base;
  clearTimeout(TM[kind+key]);TM[kind+key]=setTimeout(()=>flush(kind,key),700);setSave('pending');
}
function flush(kind,key){
  const id=kind+key;clearTimeout(TM[id]);
  CH[id]=(CH[id]||Promise.resolve()).then(()=>doFlush(kind,key));return CH[id];
}
async function doFlush(kind,key){
  const dr=DR[kind][key];if(!dr)return;
  const v=dr._v,prev=snap(),fs=FIELDS[kind];let ok=false;
  const empty=fs.every(f=>!has(dr[f]))&&!(kind==='diary'&&dr.mood);
  let data=null;
  if(!empty){data={};fs.forEach(f=>{data[f]=dr[f]||''});if(kind==='diary'){data.mood=dr.mood||0;data.date=key}else data.week=key;data.at=Date.now()}
  const m=mapOf(kind);if(data)m[key]=data;else delete m[key];
  setSave('saving');
  try{
    await writeDoc(kind==='diary'?'diary':'reviews',key,data);
    setSave('saved');ok=true;
    if(DR[kind][key]&&DR[kind][key]._v===v)delete DR[kind][key];
  }catch(e){setSave('error')}
  reward(prev,ok?(S.saveMsg||''):'');
  requestRender();
}
function flushAll(){Object.keys(DR.diary).forEach(k=>flush('diary',k));Object.keys(DR.reviews).forEach(k=>flush('reviews',k))}

/* ---------- views: review ---------- */
function moodChart(N){
  const t=TODAY(),days=2*N,start=addDays(t,-(days-1));
  const W=360,H=176,L=30,R=12,T=26,B=26,iw=W-L-R,ih=H-T-B;
  const xAt=i=>L+iw*i/(days-1),yAt=m=>T+ih*(1-(m-1)/4);
  const mood=[];for(let i=0;i<days;i++){const e=S.entries[addDays(start,i)];mood.push(e&&e.mood?e.mood:0)}
  if(mood.filter(Boolean).length<2)return null;
  const xb=(xAt(N-1)+xAt(N))/2;
  let g='',dots='',path='',pen=false;
  g+='<rect class="past" x="'+L+'" y="'+T+'" width="'+(xb-L).toFixed(1)+'" height="'+ih+'"/>';
  [1,2,3,4,5].forEach(m=>{g+='<line class="g" x1="'+L+'" x2="'+(W-R)+'" y1="'+yAt(m)+'" y2="'+yAt(m)+'"/>'+(m%2?'<text x="'+(L-6)+'" y="'+(yAt(m)+3)+'" text-anchor="end">'+m+'</text>':'')});
  for(let i=0;i<days;i++){
    if(mood[i])dots+='<circle class="dot" cx="'+xAt(i).toFixed(1)+'" cy="'+yAt(mood[i]).toFixed(1)+'" r="2.8"/>';
    let s=0,c=0;for(let k=Math.max(0,i-6);k<=i;k++)if(mood[k]){s+=mood[k];c++}
    if(c){path+=(pen?' L':' M')+xAt(i).toFixed(1)+' '+yAt(s/c).toFixed(1);pen=true}else pen=false;
  }
  const md=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()};
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="気分の推移。点は毎日の気分、線は7日間の平均。左半分が過去、右半分がいま。">'+g+
    '<line class="div" x1="'+xb.toFixed(1)+'" x2="'+xb.toFixed(1)+'" y1="'+T+'" y2="'+(T+ih)+'"/>'+
    '<text x="'+(L+4)+'" y="'+(T-9)+'">過去</text><text x="'+(xb+4).toFixed(1)+'" y="'+(T-9)+'">いま</text>'+
    '<path class="avg" d="'+path+'"/>'+dots+
    '<text x="'+L+'" y="'+(H-8)+'">'+md(start)+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+md(t)+'</text></svg>';
}

const REL=[
  {id:'rel:now',n:'いま',rel:true,hue:150,d:'今日から始める'},
  {id:'rel:soon',n:'ちょい先',rel:true,hue:200,d:'約1か月後に始める'},
  {id:'rel:mid',n:'中間',rel:true,hue:40,d:'いまと期限の真ん中'},
  {id:'rel:pre',n:'完了手前',rel:true,hue:330,d:'期限の1か月前'}];
REL.forEach(r=>{r.name=r.n});
const isRel=id=>REL.some(r=>r.id===id);
const fmtS=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()};
const addMonths=(s,n)=>{const d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d)};
function relStart(id,base,due){
  if(id==='rel:now')return base;
  if(id==='rel:soon'){const t=addMonths(base,1);return (due&&due<t)?(due<base?base:due):t}
  if(!due)return null;
  if(id==='rel:mid'){const n=Math.floor(diffDays(due,base)/2);return n>0?addDays(base,n):base}
  if(id==='rel:pre'){const t=addMonths(due,-1);return t<base?base:t}
  return null;
}
function recalcStart(g){
  if(!isRel(g.phase)){g.start=null;return}
  const s=relStart(g.phase,g.createdAt||TODAY(),g.due||'');
  if(s)g.start=s;
}
function phaseOptions(sel,base,due){
  const rel=REL.map(r=>{
    const st=relStart(r.id,base,due);
    return '<option value="'+r.id+'"'+(r.id===sel?' selected':'')+(st?'':' disabled')+'>'+r.n+(st?'('+fmtS(st)+'〜)':'(期限を入れると選べます)')+'</option>';
  }).join('');
  const cu=phasesSorted().map(p=>'<option value="'+p.id+'"'+(p.id===sel?' selected':'')+'>'+esc(p.name)+'('+p.from+'〜'+p.to+')</option>').join('');
  return '<option value="">フェーズなし</option><optgroup label="時期で選ぶ">'+rel+'</optgroup>'+(cu?'<optgroup label="人生のフェーズ">'+cu+'</optgroup>':'');
}

function buildFiles(){
  const f={},one=s=>String(s||'').replace(/\r?\n/g,' ');

  if(S.life&&has(S.life.dream))rm+='> 人生のゴール: '+one(S.life.dream)+'\n\n';
  const phs=phasesSorted();
  REL.concat(phs).concat([null]).forEach(p=>{
    const gs=p?goals().filter(g=>g.phase===p.id):goals().filter(g=>!isRel(g.phase)&&!phs.some(x=>x.id===g.phase));
    if(!gs.length&&(!p||p.rel))return;
    rm+='## '+(p?(p.rel?p.n:p.name+'('+p.from+'〜'+p.to+')'):'フェーズ未設定')+'\n\n';
    gs.forEach(g=>{rm+='### '+one(g.title)+'\n分野: '+abName(g)+'\n'+(g.due?'期限: '+g.due+'\n':'')+(g.start&&isRel(g.phase)?'開始予定: '+g.start+'\n':'');if(has(g.why))rm+=g.why+'\n';g.steps.forEach(s=>{rm+='- ['+(s.done?'x':' ')+'] '+one(s.t)+(s.done&&s.at?' (完了 '+s.at+')':'')+'\n'});rm+='\n'});
  });
  f['人生クエスト/ロードマップ.md']=rm;
  Object.keys(S.entries).sort().forEach(d=>{
    const e=S.entries[d];
    f['人生クエスト/日記/'+d+'.md']='---\ndate: '+d+'\nmood: '+(e.mood||'')+'\ntags: [lifequest/diary]\n---\n# '+d+'\n\n## できごと\n'+(e.text||'')+'\n\n## 楽しかったこと\n'+(e.fun||'')+'\n';
  });
  Object.keys(S.reviews).sort().forEach(k=>{
    const r=S.reviews[k];
    f['人生クエスト/ふりかえり/'+k+'.md']='---\nweek: '+k+'\ntags: [lifequest/review]\n---\n# '+k+' の週\n\n## うまくいったこと\n'+(r.good||'')+'\n\n## 次に試したいこと\n'+(r.next||'')+'\n\n## 1週間後の自分へ\n'+(r.message||'')+'\n';
  });
  return f;
}

  try{
    if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&navigator.canShare&&typeof File==='function'){
      const file=new File([blob],name,{type:blob.type||'application/octet-stream'});
      if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});done();return}
    }
  }catch(e){if(e&&e.name==='AbortError')return}
  try{
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);done();
  }catch(e){toast('書き出せませんでした')}
}
ACT['export-obsidian']=async()=>{
  const files=buildFiles();
  if(window.JSZip){const z=new JSZip();Object.keys(files).forEach(p=>z.file(p,files[p]));await saveFile('人生クエスト-Obsidian.zip',await z.generateAsync({type:'blob'}))}
  else await saveFile('人生クエスト-まとめ.md',Object.keys(files).map(p=>'<!-- '+p+' -->\n'+files[p]).join('\n\n'));
};
ACT['export-json']=()=>saveFile('人生クエスト-backup-'+TODAY()+'.json',JSON.stringify({app:'jinsei-quest',version:1,exportedAt:TODAY(),life:S.life,entries:S.entries,reviews:S.reviews},null,2),true);
ACT['import-json']=()=>{const f=$('#import-file');if(f){f.value='';f.click()}};
ACT['import-apply']=()=>{
  const p=S.pendingImport;if(!p)return;
  S.life=p.life;S.entries=p.entries;S.reviews=p.reviews;S.pendingImport=null;
  Object.keys(DR.diary).forEach(k=>delete DR.diary[k]);Object.keys(DR.reviews).forEach(k=>delete DR.reviews[k]);
  lsWrite();S.sheet=null;S.tab='home';render();window.scrollTo(0,0);toast('読み込みました');
};
ACT['import-cancel']=()=>{S.pendingImport=null;renderSheet()};
document.addEventListener('change',e=>{
  const t=e.target;if(!t||t.id!=='import-file'||!t.files||!t.files[0])return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||d.app!=='jinsei-quest'||!d.entries||typeof d.entries!=='object'||!d.reviews||typeof d.reviews!=='object')throw new Error('bad');
      if(d.life&&!Array.isArray(d.life.goals))throw new Error('bad');
      S.pendingImport={life:d.life||null,entries:d.entries,reviews:d.reviews};
      openSheet({type:'settings'});
    }catch(err){toast('このファイルは読み込めません。\n「JSONで書き出す」で作ったファイルを選んでください。')}
  };
  r.readAsText(t.files[0]);
});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const fn=ACT[el.dataset.a];if(fn)fn(el,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.sheet){closeSheet();return}
  if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){const t=e.target;if(t&&t.dataset&&t.dataset.enter&&ACT[t.dataset.enter]){e.preventDefault();ACT[t.dataset.enter](t)}}
});
function onInput(e){
  const t=e.target,b=t.dataset&&t.dataset.bind;if(!b)return;
  const v=t.value,sh=S.sheet,g=sh&&sh.type==='goal'?goalById(sh.id):null;
  switch(b){
    case 'd-text':setDraft('diary',S.sel,'text',v);break;
    case 'd-fun':setDraft('diary',S.sel,'fun',v);break;
    case 'r-good':setDraft('reviews',weekKey(TODAY()),'good',v);break;
    case 'r-next':setDraft('reviews',weekKey(TODAY()),'next',v);break;
    case 'r-message':setDraft('reviews',weekKey(TODAY()),'message',v);break;
    case 'q':S.q=v;S.listN=15;{const l=$('#entryList');if(l)l.innerHTML=entryListHTML()}break;
    case 'g-title':if(g){g.title=v;lifeChanged()}break;
    case 'g-phase':if(g){g.phase=v||null;recalcStart(g);lifeChanged()}break;
    case 'g-due':if(g&&e.type==='change'){g.due=v||'';recalcStart(g);lifeChanged();renderSheet()}break;
    case 'n-due':if(sh&&e.type==='change'){sh.draft.due=v||'';if(!v&&(sh.draft.phase==='rel:mid'||sh.draft.phase==='rel:pre'))sh.draft.phase='rel:now';renderSheet()}break;
    case 'g-skill':if(g){g.skill=v;lifeChanged()}break;
    case 'n-skill':sh.draft.skill=v;break;
    case 'g-why':if(g){g.why=v;lifeChanged()}break;
    case 's-text':if(g){const s=g.steps.find(x=>x.id===t.dataset.s);if(s){s.t=v;lifeChanged()}}break;
    case 'n-title':sh.draft.title=v;break;
    case 'n-phase':sh.draft.phase=v;break;
    case 'n-steps':sh.draft.steps=v;break;
    case 'p-name':case 'p-from':case 'p-to':{
      const p=sh&&S.life.phases.find(x=>x.id===sh.id);if(!p)break;
      if(b==='p-name')p.name=v;else{const n=parseInt(v,10);if(!isNaN(n))p[b==='p-from'?'from':'to']=n}
      lifeChanged();break}
    case 'set-name':S.life.name=v;lifeChanged();break;
    case 'set-dream':S.life.dream=v;lifeChanged();break;
  }
}
document.addEventListener('input',onInput);
document.addEventListener('change',onInput);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){flushAll();if(lifeTimer)lifeNow()}
  else{const t=TODAY();if(t!==S.today){S.today=t;S.sel=t;S.month=t.slice(0,7);requestRender()}}
});
window.addEventListener('pagehide',()=>{flushAll();if(lifeTimer)lifeNow()});

/* ---------- start ---------- */
function startLocal(){
  const d=lsRead();
  if(d){S.life=d.life||null;S.entries=d.entries||{};S.reviews=d.reviews||{}}
  S.loaded={life:true,diary:true,reviews:true};render();
}
function cloudErr(e){
  console.warn('db',e);
  S.loaded={life:true,diary:true,reviews:true};
  toast('読み込みに失敗しました。ページを開き直してください。');requestRender();
}
function startCloud(){
  const base=Store.base;
  base.onSnapshot(s=>{
    if(!s.metadata.fromCache)S.loaded.life=true;
    if(!(lifeBusy||lifeTimer||lifeAgain)){if(s.exists)S.life=clone(s.data());else if(!s.metadata.fromCache)S.life=null}
    requestRender();
  },cloudErr);
  base.collection('diary').onSnapshot(q=>{
    const m={};q.docs.forEach(d=>{m[d.id]=clone(d.data())});S.entries=m;
    if(!q.metadata.fromCache)S.loaded.diary=true;requestRender();
  },cloudErr);
  base.collection('reviews').onSnapshot(q=>{
    const m={};q.docs.forEach(d=>{m[d.id]=clone(d.data())});S.reviews=m;
    if(!q.metadata.fromCache)S.loaded.reviews=true;requestRender();
  },cloudErr);
  setTimeout(()=>{if(!ready()){S.loaded={life:true,diary:true,reviews:true};requestRender()}},8000);
}
function init(){
  S.today=TODAY();
  S.mode='local';
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  startLocal();
}
init();
})();
</script>

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}});
}
</script>
